name: .NET
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build-test-publish:
    name: Build, test and publish (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: macos-26
            rid: osx-arm64
          - runner: macos-26-intel
            rid: osx-x64
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Build both solutions Debug with locked restore
        run: ./.github/scripts/Invoke-PrismCi.ps1 -Stage Build -Configuration Debug
      - name: Build both solutions Release with locked restore
        id: test-build
        run: ./.github/scripts/Invoke-PrismCi.ps1 -Stage Build -Configuration Release
      - name: Preserve native file publication gate from master
        id: f01-native
        if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
        timeout-minutes: 5
        run: ./.github/scripts/Invoke-PrismCi.ps1 -Stage Native -RuntimeIdentifier ${{ matrix.rid }}
      # Each suite still runs for diagnostics after another test gate fails.
      # No continue-on-error: every failure keeps the job failed.
      - name: Test Core complete
        if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
        run: ./.github/scripts/Invoke-PrismCi.ps1 -Stage Suite -Suite Core
      - name: Test GUI complete
        if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
        run: ./.github/scripts/Invoke-PrismCi.ps1 -Stage Suite -Suite Gui
      - name: Test EditorCoordinator
        if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
        run: ./.github/scripts/Invoke-PrismCi.ps1 -Stage Suite -Suite Coordinator
      - name: Test F1 import cancellation
        if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
        run: ./.github/scripts/Invoke-PrismCi.ps1 -Stage Suite -Suite F1
      - name: Test C1 diagnostics
        if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
        run: ./.github/scripts/Invoke-PrismCi.ps1 -Stage Suite -Suite C1
      - name: Test MCP complete
        if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
        run: ./.github/scripts/Invoke-PrismCi.ps1 -Stage Suite -Suite Mcp
      - name: Publish framework-dependent Desktop Host with reviewed RID locks
        id: publish
        if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
        run: ./.github/scripts/Invoke-PrismCi.ps1 -Stage Publish -RuntimeIdentifier ${{ matrix.rid }}
      - name: Validate layout, native assets and InfoDocs
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: ./.github/scripts/Validate-DesktopPublish.ps1 -RuntimeIdentifier ${{ matrix.rid }} -PublishDirectory artifacts/publish/${{ matrix.rid }}
      - name: Upload build, test and publish diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: |
            artifacts/ci-logs/
            artifacts/test-results/
            artifacts/f01-native/
          if-no-files-found: error
